# Local development infrastructure for CoNote.
#
#   docker compose -f infra/docker-compose.yml up -d --wait     (PostgreSQL + Redis)
#   docker compose -f infra/docker-compose.yml --profile apps up --build   (also run the 3 apps in containers)
#
# Credentials come from the environment / .env (see .env.example); the defaults
# below are LOCAL DEVELOPMENT values only.
name: conote

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conote_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-conote}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis is never permanent storage (D14): no persistence is configured.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-conote}:${POSTGRES_PASSWORD:-conote_dev_password}@postgres:5432/${POSTGRES_DB:-conote}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      target: api
    environment:
      NODE_ENV: production
      PORT: '4000'
      APP_URL: http://localhost:3000
      # The web container reaches the API over the Compose network (private address range).
      TRUST_PROXY: uniquelocal
      DATABASE_URL: postgresql://${POSTGRES_USER:-conote}:${POSTGRES_PASSWORD:-conote_dev_password}@postgres:5432/${POSTGRES_DB:-conote}
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  collab:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      target: collab
    environment:
      NODE_ENV: production
      COLLAB_PORT: '4100'
      DATABASE_URL: postgresql://${POSTGRES_USER:-conote}:${POSTGRES_PASSWORD:-conote_dev_password}@postgres:5432/${POSTGRES_DB:-conote}
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4100:4100'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: ['apps']
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      API_INTERNAL_URL: http://api:4000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
